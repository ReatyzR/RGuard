author: ReatyzR
api-version: 1.8
description: RGuard 1.8.9 - Runtime protocol integrity and connection protection
commands:
  rguard:
    description: RGuard control interface
    permission: rguard.admin
    aliases: [rg, anticrash]
permissions:
